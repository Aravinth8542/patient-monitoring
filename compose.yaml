
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
    command:
      - python
      - -m
      - scripts.run_container_migrations

  runtime-provision:
    build: .
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
    command: ["python", "-m", "scripts.provision_test_runtime"]

  test-db-init:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      runtime-provision:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
    command: ["python", "-m", "scripts.prepare_test_database"]

  pytest:
    profiles: ["test"]
    build: .
    restart: "no"
    depends_on:
      test-db-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
    volumes:
      - ./tests:/srv/app/tests:ro
    command: ["python", "-m", "scripts.run_compose_pytest"]

  seed:
    build: .
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
    command:
      - python
      - -c
      - "import os; from scripts.run_container_api import docker_database_url; os.environ['DATABASE_URL'] = docker_database_url('DATABASE_URL'); from scripts.seed_dev import main; main()"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      test-db-init:
        condition: service_completed_successfully
      runtime-provision:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: ${TEST_MODE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - python
      - -m
      - scripts.run_container_api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-provision:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      TEST_MODE: "0"
      NO_DATA_INTERVAL_SECONDS: "300"
    command:
      - python
      - -m
      - scripts.run_no_data_scheduler

volumes:
  postgres_data:
